
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lab6 AI Chat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <!-- =========================
         Top Bar
    ========================= -->

    <header class="topbar">

        <div>

            <strong>
                Lab6 AI Chat
            </strong>

            <span class="user">
                登入：{{ username }}
            </span>

        </div>

        <form
            method="POST"
            action="{{ url_for('logout') }}"
        >

            <button
                class="secondary"
                type="submit"
            >
                登出
            </button>

        </form>

    </header>


    <!-- =========================
         Chat Area
    ========================= -->

    <main class="chat-shell">

        <!-- 聊天訊息顯示區 -->
        <section
            id="messages"
            class="messages"
            aria-live="polite"
        >

            <div class="message ai">
                AI Chat：你好！請選擇 AI 模型並輸入問題。
            </div>

        </section>


        <!-- =========================
             Chat Form
        ========================= -->

        <form
            id="chat-form"
            class="chat-form"
        >

            <!-- AI 模型選擇 -->
            <label for="model-select">
                選擇 AI 模型：
            </label>

            <select
                id="model-select"
                name="model"
            >

                <option value="gemini">
                    Gemini
                </option>

                <option value="openrouter">
                    OpenRouter
                </option>

            </select>


            <!-- 訊息輸入框 -->
            <input
                id="message-input"
                type="text"
                placeholder="輸入訊息..."
                maxlength="2000"
                autocomplete="off"
                required
            >


            <!-- 送出按鈕 -->
            <button
                id="send-button"
                type="submit"
            >
                送出
            </button>

        </form>


        <!-- =========================
             Reset Conversation
        ========================= -->

        <button
            id="reset-button"
            class="secondary reset-button"
            type="button"
        >
            開始新對話
        </button>

    </main>


    <!-- =========================
         JavaScript
    ========================= -->

    <script
        src="{{ url_for('static', filename='chat.js') }}"
    ></script>

</body>

</html>
